repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: uv run ruff check --fix
        language: unsupported
        types_or: [python, pyi]
      - id: ruff-format
        name: Ruff format
        entry: uv run ruff format
        language: unsupported
        types_or: [python, pyi]
      - id: mypy
        name: mypy
        entry: uv run mypy src tests migrations
        language: unsupported
        pass_filenames: false
        files: ^(src/|tests/|migrations/|pyproject\.toml$|uv\.lock$)
