[project]
name = "form"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastmcp",
    "pydantic",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["form", "models"]

[dependency-groups]
dev = [
    "mypy",
    "ruff",
]
