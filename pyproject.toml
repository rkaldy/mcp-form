[project]
name = "form"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "czech-sort>=1.1.0",
    "fastapi>=0.165.0",
    "gspread>=6.2.1",
    "imagesize>=2.0.1",
    "litellm>=1.110.2",
    "pillow>=12.2,<12.3",
    "pydantic",
    "pydantic-settings>=2.16.3",
    "sqlalchemy>=2.1.9",
    "uvicorn>=0.38",
]

[dependency-groups]
dev = [
    "freezegun>=1.5.5",
    "httpx>=0.28.1",
    "mypy",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-mock>=3.17.0",
    "ruff",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ['ignore:Items? .* on TypedDict class .* (is|are) using the `ReadOnly` qualifier.*:UserWarning:pydantic\._internal\._generate_schema']

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
form = ["static/*", "static/assets/*"]

[tool.mypy]
explicit_package_bases = true
mypy_path = "src"
plugins = ["pydantic.mypy"]
