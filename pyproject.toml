[project]
name = "form"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.165.0",
    "pydantic",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "mypy",
    "ruff",
    "workers-py>=1.17.9",
    "workers-runtime-sdk>=1.9.6",
]
