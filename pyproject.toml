[project]
name = "form"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.165.0",
    "imagesize>=2.0.1",
    "litellm>=1.110.2",
    "pillow>=12.2,<12.3",
    "pydantic",
    "pydantic-settings>=2.16.3",
]

[dependency-groups]
dev = [
    "alembic>=1.20.1",
    "httpx>=0.28.1",
    "mypy",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-mock>=3.17.0",
    "ruff",
    "sqlalchemy>=2.1.9",
    "workers-py>=1.17.9",
    "workers-runtime-sdk>=1.9.6",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ['ignore:Items? .* on TypedDict class .* (is|are) using the `ReadOnly` qualifier.*:UserWarning:pydantic\._internal\._generate_schema']

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
plugins = ["pydantic.mypy"]
